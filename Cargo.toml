[package]
name = "air"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "derive", "chrono", "runtime-async-std"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
